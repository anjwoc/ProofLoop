name: Evidence Gates

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run focused integrity tests
        id: focused
        continue-on-error: true
        run: |
          mkdir -p reports/qa/f2
          set +e
          python -m pytest \
            tests/deterministic/test_prompt_compiler_pipeline.py \
            tests/deterministic/test_prompt_template_algebra.py \
            tests/deterministic/test_role_prompt_projection.py \
            tests/deterministic/test_fake_success_barrier.py \
            tests/deterministic/test_run_policy.py \
            tests/deterministic/test_repair_decision_table.py \
            tests/deterministic/test_ponytail_enforcement.py -q \
            2>&1 | tee reports/qa/f2/focused-tests.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate prompt pipeline
        id: prompt
        continue-on-error: true
        run: |
          set +e
          python scripts/validate_prompt_pipeline.py 2>&1 | tee reports/qa/f2/prompt-pipeline.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate hidden policy
        id: policy
        continue-on-error: true
        run: |
          set +e
          python scripts/validate_no_hidden_policy.py 2>&1 | tee reports/qa/f2/hidden-policy.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate documented command paths
        id: docs
        continue-on-error: true
        run: |
          set +e
          python scripts/validate_documented_commands.py 2>&1 | tee reports/qa/f2/documented-commands.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run deterministic suite
        id: suite
        continue-on-error: true
        run: |
          set +e
          python scripts/run_tests.py 2>&1 | tee reports/qa/f2/deterministic-suite.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate package
        id: package
        continue-on-error: true
        run: |
          set +e
          python scripts/validate_package.py 2>&1 | tee reports/qa/f2/package-validation.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload raw QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-qa-${{ github.run_id }}
          path: reports/qa/f2/
          if-no-files-found: error

      - name: Enforce gate results
        if: always()
        run: |
          failed=0
          for item in \
            "focused:${{ steps.focused.outputs.exit_code }}" \
            "prompt:${{ steps.prompt.outputs.exit_code }}" \
            "policy:${{ steps.policy.outputs.exit_code }}" \
            "docs:${{ steps.docs.outputs.exit_code }}" \
            "suite:${{ steps.suite.outputs.exit_code }}" \
            "package:${{ steps.package.outputs.exit_code }}"
          do
            name=${item%%:*}
            code=${item##*:}
            if [ "$code" != "0" ]; then
              echo "$name failed with exit code $code"
              failed=1
            fi
          done
          exit "$failed"
