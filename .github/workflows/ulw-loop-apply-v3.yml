name: ULW Loop Apply V3

on:
  push:
    branches:
      - codex/preserve-eb097dd-with-main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Apply assertion-backed migration
        run: python scripts/ulw_policy_migrate.py

      - name: Run focused integrity suite
        run: |
          python -m pytest \
            tests/deterministic/test_prompt_compiler_pipeline.py \
            tests/deterministic/test_prompt_template_algebra.py \
            tests/deterministic/test_role_prompt_projection.py \
            tests/deterministic/test_fake_success_barrier.py \
            tests/deterministic/test_run_policy.py \
            tests/deterministic/test_repair_decision_table.py \
            tests/deterministic/test_ponytail_enforcement.py -q

      - name: Run full deterministic suite
        run: python scripts/run_tests.py

      - name: Validate prompt and documentation contracts
        run: |
          python scripts/validate_prompt_pipeline.py
          python scripts/validate_documented_commands.py

      - name: Validate package
        run: python scripts/validate_package.py

      - name: Commit only a green migration
        run: |
          rm -f .github/workflows/ulw-loop-policy-migration.yml
          rm -f .github/workflows/ulw-loop-policy-migration-v2.yml
          rm -f .github/workflows/ulw-loop-apply-v3.yml
          rm -f scripts/ulw_policy_migrate.py
          rm -f reports/qa/ulw-migration-error.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor(policy): wire resolved policy through runtime"
          git push origin HEAD:${GITHUB_REF_NAME}
