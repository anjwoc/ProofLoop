<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Single-model workflow compared with ProofLoop proof-driven model routing</title>
  <desc id="desc">The single-model path uses one model for interpretation, design, implementation, retries, and self-review. ProofLoop classifies workload, uses strong models at decision boundaries, fast models in feedback-rich loops, deterministic verification, and a proof-owned truth gate.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset="1" stop-color="#0d131b"/>
    </linearGradient>
    <linearGradient id="singlePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22171a"/>
      <stop offset="1" stop-color="#16151a"/>
    </linearGradient>
    <linearGradient id="proofPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a18"/>
      <stop offset="1" stop-color="#0d151c"/>
    </linearGradient>
    <linearGradient id="strongFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e5cff"/>
      <stop offset="1" stop-color="#4b3ec7"/>
    </linearGradient>
    <linearGradient id="fastFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d6172"/>
      <stop offset="1" stop-color="#17434f"/>
    </linearGradient>
    <linearGradient id="proofFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7ff70"/>
      <stop offset="1" stop-color="#8ed44d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#73808e"/>
    </marker>
    <marker id="arrowProof" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8f565"/>
    </marker>
    <marker id="arrowFail" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff8c8c"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 42px; font-weight: 700; fill: #f5f7f2; letter-spacing: -1px; }
      .subtitle { font-size: 19px; font-weight: 400; fill: #a7b0ba; }
      .panel-title { font-size: 24px; font-weight: 700; fill: #f5f7f2; }
      .panel-subtitle { font-size: 15px; font-weight: 400; fill: #9ba6b2; }
      .node-title { font-size: 16px; font-weight: 700; fill: #f5f7f2; }
      .node-copy { font-size: 13px; font-weight: 400; fill: #bec6ce; }
      .dark-title { font-size: 17px; font-weight: 800; fill: #10150d; }
      .dark-copy { font-size: 12px; font-weight: 600; fill: #26351c; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; }
      .risk { font-size: 14px; font-weight: 600; fill: #e6a6a6; }
      .benefit { font-size: 14px; font-weight: 600; fill: #c8e9ae; }
      .footer { font-size: 15px; font-weight: 500; fill: #b7c0ca; }
    </style>
  </defs>

  <rect width="1440" height="960" rx="28" fill="url(#background)"/>
  <circle cx="1165" cy="154" r="220" fill="#405b34" opacity="0.12" filter="url(#glow)"/>
  <circle cx="230" cy="290" r="190" fill="#6f3038" opacity="0.09" filter="url(#glow)"/>

  <text x="72" y="74" class="title">Proof-Driven Model Routing</text>
  <text x="72" y="108" class="subtitle">Strong judgment at boundaries · Fast loops under feedback · Evidence owns completion</text>

  <rect x="56" y="150" width="560" height="700" rx="28" fill="url(#singlePanel)" stroke="#513237" stroke-width="1.5"/>
  <rect x="644" y="150" width="740" height="700" rx="28" fill="url(#proofPanel)" stroke="#365241" stroke-width="1.5"/>

  <text x="88" y="198" class="panel-title">Single-model workflow</text>
  <text x="88" y="224" class="panel-subtitle">One model owns every decision and judges its own result</text>

  <rect x="98" y="264" width="166" height="58" rx="14" fill="#242932" stroke="#414a56"/>
  <text x="181" y="290" class="node-title" text-anchor="middle">User request</text>
  <text x="181" y="309" class="node-copy" text-anchor="middle">rough objective</text>
  <line x1="264" y1="293" x2="318" y2="293" stroke="#73808e" stroke-width="2" marker-end="url(#arrowMuted)"/>

  <rect x="326" y="252" width="236" height="82" rx="18" fill="#5b3440" stroke="#9f5869"/>
  <text x="444" y="283" class="node-title" text-anchor="middle">One model</text>
  <text x="444" y="306" class="node-copy" text-anchor="middle">same context · same biases</text>

  <line x1="444" y1="334" x2="444" y2="376" stroke="#73808e" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <rect x="108" y="386" width="436" height="188" rx="22" fill="#171b21" stroke="#3d444e"/>
  <text x="146" y="425" class="label" fill="#d68c9b">EVERY STEP</text>
  <text x="146" y="463" class="node-title">Interpret  →  Design  →  Explore</text>
  <text x="146" y="499" class="node-title">Implement  →  Retry  →  Self-review</text>
  <text x="146" y="537" class="node-copy">Premium capacity may be spent on routine steps,</text>
  <text x="146" y="558" class="node-copy">while early mistakes remain correlated end to end.</text>

  <line x1="326" y1="574" x2="326" y2="616" stroke="#73808e" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <rect x="155" y="626" width="342" height="86" rx="18" fill="#261a1d" stroke="#7a444e"/>
  <text x="326" y="660" class="node-title" text-anchor="middle">The model declares completion</text>
  <text x="326" y="685" class="node-copy" text-anchor="middle">confidence and evidence can collapse together</text>

  <text x="104" y="760" class="risk">Higher repeated cost on routine work</text>
  <text x="104" y="790" class="risk">Correlated errors across the entire workflow</text>
  <text x="104" y="820" class="risk">A confident answer is not repository proof</text>

  <text x="680" y="198" class="panel-title">ProofLoop model routing</text>
  <text x="680" y="224" class="panel-subtitle">Models perform roles; Proof controls escalation, repetition, and completion</text>

  <rect x="680" y="258" width="150" height="58" rx="14" fill="#242932" stroke="#414a56"/>
  <text x="755" y="284" class="node-title" text-anchor="middle">User request</text>
  <text x="755" y="303" class="node-copy" text-anchor="middle">original intent</text>
  <line x1="830" y1="287" x2="870" y2="287" stroke="#b8f565" stroke-width="2" marker-end="url(#arrowProof)"/>

  <rect x="878" y="250" width="192" height="74" rx="16" fill="#18222a" stroke="#455462"/>
  <text x="974" y="278" class="node-title" text-anchor="middle">Intent contract</text>
  <text x="974" y="300" class="node-copy" text-anchor="middle">scope · unknowns · authority</text>
  <line x1="1070" y1="287" x2="1110" y2="287" stroke="#b8f565" stroke-width="2" marker-end="url(#arrowProof)"/>

  <rect x="1118" y="250" width="224" height="74" rx="16" fill="#18222a" stroke="#455462"/>
  <text x="1230" y="278" class="node-title" text-anchor="middle">Workload T0–T3</text>
  <text x="1230" y="300" class="node-copy" text-anchor="middle">risk · surface · uncertainty</text>

  <line x1="1230" y1="324" x2="1230" y2="360" stroke="#73808e" stroke-width="2"/>
  <line x1="1230" y1="360" x2="823" y2="360" stroke="#73808e" stroke-width="2"/>
  <line x1="823" y1="360" x2="823" y2="392" stroke="#73808e" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <line x1="1230" y1="360" x2="1138" y2="360" stroke="#73808e" stroke-width="2"/>
  <line x1="1138" y1="360" x2="1138" y2="392" stroke="#73808e" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <text x="852" y="352" class="label" fill="#7fd5e4">T0–T1 FAST LANE</text>
  <text x="1152" y="352" class="label" fill="#aa9fff">T2–T3 DEEP LANE</text>

  <rect x="692" y="402" width="260" height="92" rx="18" fill="url(#fastFill)" stroke="#3c8394"/>
  <text x="823" y="435" class="node-title" text-anchor="middle">Fast model loop</text>
  <text x="823" y="459" class="node-copy" text-anchor="middle">Claude Haiku · Gemini 3.5 Flash</text>
  <text x="823" y="479" class="node-copy" text-anchor="middle">explore · implement · retry</text>

  <rect x="994" y="402" width="288" height="92" rx="18" fill="url(#strongFill)" stroke="#9186ff"/>
  <text x="1138" y="435" class="node-title" text-anchor="middle">Strong model judgment</text>
  <text x="1138" y="459" class="node-copy" text-anchor="middle">Claude Opus · Fable · GPT-5.6 Sol</text>
  <text x="1138" y="479" class="node-copy" text-anchor="middle">design · review · escalation</text>

  <line x1="994" y1="448" x2="960" y2="448" stroke="#b8f565" stroke-width="2" marker-end="url(#arrowProof)"/>
  <line x1="823" y1="494" x2="823" y2="534" stroke="#b8f565" stroke-width="2" marker-end="url(#arrowProof)"/>

  <rect x="704" y="544" width="312" height="90" rx="18" fill="#18222a" stroke="#587184"/>
  <text x="860" y="577" class="node-title" text-anchor="middle">Deterministic verification</text>
  <text x="860" y="601" class="node-copy" text-anchor="middle">tests · build · diff guard · current artifacts</text>
  <text x="860" y="621" class="node-copy" text-anchor="middle">closes or reopens proof obligations</text>

  <path d="M704 590 C660 590, 660 448, 684 448" fill="none" stroke="#ff8c8c" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowFail)"/>
  <text x="659" y="522" class="label" fill="#ff9c9c" transform="rotate(-90 659 522)">FIRST FAILURE · RETRY FAST</text>

  <path d="M1016 566 C1050 526, 1092 524, 1138 508" fill="none" stroke="#ff8c8c" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowFail)"/>
  <text x="1024" y="530" class="label" fill="#ff9c9c">REPEAT ×2 / FAST BUDGET</text>

  <line x1="1016" y1="589" x2="1062" y2="589" stroke="#b8f565" stroke-width="2" marker-end="url(#arrowProof)"/>
  <rect x="1070" y="544" width="272" height="90" rx="18" fill="#1a2028" stroke="#6b628f"/>
  <text x="1206" y="577" class="node-title" text-anchor="middle">Conditional deep review</text>
  <text x="1206" y="601" class="node-copy" text-anchor="middle">intent alignment · risk · minimality</text>
  <text x="1206" y="621" class="node-copy" text-anchor="middle">skipped when proof does not require it</text>

  <line x1="1206" y1="634" x2="1206" y2="676" stroke="#b8f565" stroke-width="2" marker-end="url(#arrowProof)"/>
  <line x1="860" y1="634" x2="860" y2="660" stroke="#b8f565" stroke-width="2"/>
  <line x1="860" y1="660" x2="1040" y2="660" stroke="#b8f565" stroke-width="2"/>
  <line x1="1040" y1="660" x2="1040" y2="676" stroke="#b8f565" stroke-width="2" marker-end="url(#arrowProof)"/>

  <rect x="886" y="686" width="396" height="100" rx="22" fill="url(#proofFill)" filter="url(#glow)"/>
  <text x="1084" y="720" class="dark-title" text-anchor="middle">Proof Graph + Truth Gate</text>
  <text x="1084" y="746" class="dark-copy" text-anchor="middle">models submit work · evidence owns completion</text>
  <text x="1084" y="770" class="dark-title" text-anchor="middle">PROVEN · UNPROVEN · FAILED · BLOCKED</text>

  <rect x="680" y="798" width="664" height="44" rx="12" fill="#151c23" stroke="#4f5c68"/>
  <text x="700" y="816" class="label" fill="#ffcb66">ESCALATE WHEN</text>
  <text x="838" y="816" class="node-copy">high-risk/public contract · ambiguity · broad first diff</text>
  <text x="700" y="835" class="node-copy">same fingerprint ×2 / fast budget · recovery or review exposes an open proof gap</text>

  <rect x="56" y="872" width="1328" height="58" rx="14" fill="#111821" stroke="#293542"/>
  <text x="720" y="897" class="footer" text-anchor="middle">Model names are configurable routing examples, not hard-coded provider requirements.</text>
  <text x="720" y="918" class="footer" text-anchor="middle">Efficiency is the design hypothesis. Paired quality and token benchmarks must prove the outcome.</text>
</svg>
