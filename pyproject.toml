[project]
name = "proofloop-skill-first-core"
version = "0.4.0a0"
description = "Skill-first software engineering loop with truth and anti-bloat assurance"
requires-python = ">=3.10"

[project.optional-dependencies]
acp = ["agent-client-protocol>=0.11,<1"]

[project.scripts]
proofloop-core = "proofloop_core.cli:main"

[tool.setuptools.packages.find]
include = ["proofloop_core*"]

[tool.ruff.lint.per-file-ignores]
# CLI entry scripts extend sys.path before importing the local package.
"scripts/*.py" = ["E402"]
